[project]
name = "kicad-claude-mcp"
version = "2.0.0"
description = "MCP server that lets Claude Code design KiCAD PCBs by editing project files."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Grigory Filimonov" }]
dependencies = [
    "mcp[cli]>=1.25,<2",
    # The s-expression parser. `sch_io._RawNumberParser` overrides
    # `sexpdata.Parser.atom`, an internal method: keep the pin narrow.
    "sexpdata>=1.0.2,<1.1",
    "httpx>=0.27",
    "rapidfuzz>=3",
    "python-dotenv>=1.0",
    "pypdf>=5",
]

[dependency-groups]
dev = [
    # Only a test cross-checks the blank project with a second parser.
    "kicad-skip>=0.2.5",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kicad_claude"]

[tool.ruff]
# `source_repo/` holds a clone of KiCAD's own C++ tree, kept for reference (its
# `Prettify` is ported in `adapters/kicad_prettify.py`). It is gitignored, and
# ruff honours that by default — this makes it explicit so the exclusion
# survives the clone being tracked or `respect-gitignore` being turned off.
extend-exclude = ["source_repo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that invoke kicad-cli or Freerouting (deselect with -m \"not slow\")",
    "network: tests that hit external APIs (DigiKey, Mouser, SnapEDA)",
]
